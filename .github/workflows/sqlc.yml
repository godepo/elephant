name: sqlc compatibility
on:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  sqlc:
    name: sqlc compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - uses: actions/setup-go@6edd4406fa81c3da01a34fa6f6343087c207a568 # v3.5.0
      # The workspace resolves the fixture against the root module's current dependencies,
      # so dependency bumps in the root go.mod do not require updating the fixture's go.mod.
      - name: go work
        run: go work init . ./internal/sqlcbatch

      - name: test sqlc batches
        run: go test ./internal/sqlcbatch/... -count=1 -race
